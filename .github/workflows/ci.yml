name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linklet
          POSTGRES_PASSWORD: linklet
          POSTGRES_DB: linklet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linklet -d linklet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags=integration ./internal/postgres
        env:
          DATABASE_URL: postgres://linklet:linklet@localhost:5432/linklet?sslmode=disable
      - run: go build ./cmd/api
      - run: ./scripts/check-coverage.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: web
      - run: npm run lint && npm run build
        working-directory: web
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api .
      - run: docker build -f web/Dockerfile web
